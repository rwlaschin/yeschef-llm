name: Claude on new issue

on:
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A new issue was opened.
            Title: "${{ github.event.issue.title }}"
            Body: ${{ github.event.issue.body }}

            Read the issue, investigate the repository, and post a comment
            with your understanding of the problem and a proposed plan.
