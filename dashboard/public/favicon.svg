<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="YesChef Orchestrator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9b94a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- dark dashboard tile -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#f5a623" stroke-opacity="0.18"/>
  <!-- orchestration: a central hub routing to its worker nodes, in the saffron accent -->
  <g stroke="url(#acc)" stroke-width="2.2" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="7.2"/>
    <line x1="16" y1="16" x2="8.4" y2="22"/>
    <line x1="16" y1="16" x2="23.6" y2="22"/>
  </g>
  <g fill="url(#acc)">
    <circle cx="16" cy="7.2" r="2.5"/>
    <circle cx="8.4" cy="22" r="2.5"/>
    <circle cx="23.6" cy="22" r="2.5"/>
    <circle cx="16" cy="16" r="3.4"/>
  </g>
</svg>
